<div class="clorinda-page-container">
  <!-- Dynamic Dashboard Header with Greeting -->
  <div class="dashboard-hero animate-fade-in">
    <div class="dashboard-hero-content">
      <h1 class="dashboard-hero-title">
        Bienvenido,
        <span class="title-highlight">{{ currentUser()?.username }}</span>
      </h1>
    </div>
  </div>

  <div class="clorinda-workspace mt-4">
    <!-- Responsive Action Grid (Square Buttons Grouped Close Together) -->
    <div class="dashboard-action-pad animate-fade-in">
      @for (item of dashboardItems(); track item.route; let i = $index) {
        <button
          type="button"
          class="dashboard-card-btn"
          (click)="navigateTo(item.route)"
          [attr.aria-label]="'Abrir módulo ' + item.label"
        >
          <div class="dashboard-card-content">
            <div class="dashboard-icon-wrapper">
              <i class="bi {{ item.icon }} dashboard-icon"></i>
            </div>
            <h5 class="dashboard-card-label">{{ item.label }}</h5>
          </div>
        </button>
      }
    </div>
  </div>
</div>
